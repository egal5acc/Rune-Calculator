<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Tab Rechner</title>
    <style>
        /* Modernes, dunkles Design passend zu deinem Screenshot */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #e2e8f0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        /* Inputs & Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #151a22;
            padding: 15px;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: bold;
        }
        .input-group input {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            width: 120px;
        }
        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .tab-btn {
            background: #151a22;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        /* Liste & Items */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .item-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-left: 4px solid #10b981;
            padding: 15px;
            border-radius: 8px;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #10b981;
        }
        .item-chance {
            font-size: 12px;
            color: #94a3b8;
        }
        .stat-line {
            font-size: 14px;
            margin: 4px 0;
            color: #cbd5e1;
        }
        .stat-name {
            color: #fbbf24;
            font-weight: bold;
        }
        /* Hilfsklasse zum Ausblenden */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

        <div class="input-group">
            <label for="rollSpeed">Roll Speed (Rolls/s):</label>
            <input type="number" id="rollSpeed" value="1" min="0.1" step="0.1">
        </div>
        <div class="input-group">
            <label for="normalLuck">Normal Luck:</label>
            <input type="number" id="normalLuck" value="1" min="1">
        </div>
        <div class="input-group hidden" id="caveLuckGroup">
            <label for="caveLuck">Cave Luck (C.Luck):</label>
            <input type="number" id="caveLuck" value="1" min="1">
        </div>
    </div>

    <div class="tabs" id="tabContainer">
        </div>

    <div class="item-list" id="itemList">
        </div>

</div>

let activeTab = "Normal";

// Helper: Suffix-Parser (10K -> 10.000, 1.5M -> 1.500.000, 30B -> 30.000.000.000)
function parseSuffix(value) {
    if (typeof value !== 'string') return parseFloat(value) || 0;
    const num = parseFloat(value);
    const suffix = value.replace(/[0-9.]/g, '').toUpperCase();
    const multipliers = { 'K': 1e3, 'M': 1e6, 'B': 1e9, 'T': 1e12, 'QA': 1e15, 'QI': 1e18, 'UD': 1e36, 'OC': 1e27, 'UVG': 1e63, 'SP': 1e24, 'DD': 1e39, 'SX': 1e21, 'QUI': 1e48, 'SPD': 1e54, 'ND': 1e60, 'DC': 1e33, 'QUA': 1e45, 'OCD': 1e57, 'VG': 1e66, 'QAVG': 1e75, 'SPVG': 1e84 };
    return multipliers[suffix] ? num * multipliers[suffix] : num;
}

// Formatierer für Zeitwerte
function formatTime(seconds) {
    if (seconds === Infinity || isNaN(seconds)) return "N/A";
    if (seconds < 60) return `${seconds.toFixed(1)}s`;
    const mins = Math.floor(seconds / 60);
    const hrs = Math.floor(mins / 60);
    const days = Math.floor(hrs / 24);
    
    if (days > 0) return `${days}d ${hrs % 24}h`;
    if (hrs > 0) return `${hrs}h ${mins % 60}m`;
    return `${mins}m ${Math.floor(seconds % 60)}s`;
}

// Haupt-Rechenfunktion
function calculateAndRender() {
    const listContainer = document.getElementById("itemList");
    listContainer.innerHTML = "";

    const rollSpeed = parseFloat(document.getElementById("rollSpeed").value) || 1;
    const normalLuck = parseFloat(document.getElementById("normalLuck").value) || 1;
    const caveLuck = parseFloat(document.getElementById("caveLuck").value) || 1;

    // Dynamische Luck-Zuweisung
    const activeLuck = (activeTab === "CaveRune") ? caveLuck : normalLuck;

    // Nur bei Cave Rune wird das C.Luck Feld eingeblendet
    const caveLuckGroup = document.getElementById("caveLuckGroup");
    if (activeTab === "CaveRune") {
        caveLuckGroup.classList.remove("hidden");
    } else {
        caveLuckGroup.classList.add("hidden");
    }

    const items = gameData[activeTab] || [];

    items.forEach(item => {
        const baseChanceVal = parseSuffix(item.c);
        const currentChance = Math.max(1, baseChanceVal / activeLuck);

        const card = document.createElement("div");
        card.className = "item-card";

        let headerHtml = `
            <div class="item-header">
                <span class="item-name">${item.r}</span>
                <span class="item-chance">Base: 1 in ${item.c} | Current: 1 in ${Math.round(currentChance).toLocaleString('de-DE')}</span>
            </div>
        `;

        let statsHtml = "";
        item.s.forEach(stat => {
            const needVal = parseSuffix(stat.nd);
            const rollsPerSecond = rollSpeed / currentChance;
            const secondsToMax = needVal / rollsPerSecond;

            statsHtml += `
                <div class="stat-line">
                    <span class="stat-name">${stat.n} ${stat.v}</span> | 
                    Need: <strong>${stat.nd}</strong> | 
                    Time to Max: <strong>${formatTime(secondsToMax)}</strong>
                </div>
            `;
        });

        card.innerHTML = headerHtml + statsHtml;
        listContainer.appendChild(card);
    });
}

// Erstellen der Navigations-Tabs
function setupTabs() {
    const tabContainer = document.getElementById("tabContainer");
    tabContainer.innerHTML = "";

    Object.keys(gameData).forEach(tabName => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${tabName === activeTab ? 'active' : ''}`;
        btn.textContent = tabName === "CaveRune" ? "Cave Rune ⛏️" : tabName;
        
        btn.addEventListener("click", () => {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            activeTab = tabName;
            calculateAndRender();
        });
        tabContainer.appendChild(btn);
    });
}

// Live-Update bei Tastatureingabe
document.querySelectorAll(".controls input").forEach(input => {
    input.addEventListener("input", calculateAndRender);
});

// Setup ausführen
setupTabs();
calculateAndRender();
</script>
