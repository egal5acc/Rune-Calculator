<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slayer Incremental Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calculator-card {
      background-color: #121620;
      border: 1px solid #1e2433;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 1000px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .tab-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background-color: #1a202c;
      border: 1px solid #2d3748;
      color: #a0aec0;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: #3182ce;
      color: #ffffff;
      border-color: #3182ce;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: #a0aec0;
      font-weight: 600;
    }

    .input-wrapper {
      display: flex;
      gap: 6px;
    }

    input, select {
      background-color: #0b0e14;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #3182ce;
    }

    select {
      width: 80px;
      cursor: pointer;
    }

    .divider {
      height: 1px;
      background-color: #1e2433;
      margin-bottom: 20px;
    }

    .results-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      font-size: 0.95rem;
      color: #a0aec0;
    }

    .result-value {
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h1 class="title">Slayer Incremental Calculator</h1>

    <!-- Tab Selection -->
    <div class="tab-container">
      <button class="tab-btn active" onclick="setCategory('Rune')">Rune</button>
      <button class="tab-btn" onclick="setCategory('Cave')">Cave Rune</button>
      <button class="tab-btn" onclick="setCategory('Aura')">Aura</button>
    </div>

    <!-- Inputs -->
    <div class="input-grid">
      <div class="input-group">
        <label id="labelSpeed">Rune Speed (sec)</label>
        <input type="number" id="speed" value="0.08" min="0.05" step="0.01" oninput="calculate()" />
      </div>

      <div class="input-group">
        <label id="labelBulk">Rune Bulk</label>
        <div class="input-wrapper">
          <input type="number" id="bulkVal" value="105.65" step="any" oninput="calculate()" />
          <select id="bulkUnit" onchange="calculate()"></select>
        </div>
      </div>

      <div class="input-group">
        <label id="labelLuck">Rune Luck</label>
        <div class="input-wrapper">
          <input type="number" id="luckVal" value="19.61" step="any" oninput="calculate()" />
          <select id="luckUnit" onchange="calculate()"></select>
        </div>
      </div>

      <div class="input-group">
        <label id="labelClone">Rune Clone</label>
        <input type="number" id="cloneVal" value="7" step="any" oninput="calculate()" />
      </div>
    </div>

    <div class="divider"></div>

    <!-- Outputs -->
    <div class="results-container">
      <div>Rolls/sec: <span class="result-value" id="rollsPerSec">0.00</span></div>
      <div><span id="labelOutputSec">Runes/sec</span>: <span class="result-value" id="totalPerSec">0.00</span></div>
    </div>
  </div>

  <script>
    const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qua', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg'];
    let currentCategory = 'Rune';

    // Populate Suffix Dropdowns
    function populateDropdowns() {
      const bulkSelect = document.getElementById('bulkUnit');
      const luckSelect = document.getElementById('luckUnit');

      suffixes.forEach((suf, index) => {
        const opt1 = document.createElement('option');
        opt1.value = index;
        opt1.textContent = suf || '---';
        bulkSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = index;
        opt2.textContent = suf || '---';
        luckSelect.appendChild(opt2);
      });

      // Set initial selections (Td = index 13, Qua = index 14)
      bulkSelect.value = 13;
      luckSelect.value = 14;
    }

    // Switch Category Tab & Update Labels
    function setCategory(cat) {
      currentCategory = cat;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(cat));
      });

      let prefix = cat;
      let plural = cat === 'Cave' ? 'Caves' : (cat === 'Aura' ? 'Auras' : 'Runes');

      document.getElementById('labelSpeed').textContent = `${prefix} Speed (sec)`;
      document.getElementById('labelBulk').textContent = `${prefix} Bulk`;
      document.getElementById('labelLuck').textContent = `${prefix} Luck`;
      document.getElementById('labelClone').textContent = `${prefix} Clone`;
      document.getElementById('labelOutputSec').textContent = `${plural}/sec`;

      calculate();
    }

    // Convert value + suffix index to BigNumber or standard JS number
    function getFullValue(val, suffixIndex) {
      return val * Math.pow(10, suffixIndex * 3);
    }

    // Format number back into standard notation + suffix
    function formatNumber(num) {
      if (num === 0 || !isFinite(num)) return '0.00';
      
      let e = Math.floor(Math.log10(Math.abs(num)));
      let suffixIdx = Math.floor(e / 3);

      if (suffixIdx < 0) return num.toFixed(2);
      if (suffixIdx >= suffixes.length) suffixIdx = suffixes.length - 1;

      let scaled = num / Math.pow(10, suffixIdx * 3);
      return scaled.toFixed(2) + suffixes[suffixIdx];
    }

    // Main Calculation Logic
    function calculate() {
      // Minimum Speed Cap set to 0.05
      const MIN_SPEED = 0.05;
      let speedInput = parseFloat(document.getElementById('speed').value) || MIN_SPEED;
      let speed = Math.max(MIN_SPEED, speedInput);

      let bulkVal = parseFloat(document.getElementById('bulkVal').value) || 0;
      let bulkUnit = parseInt(document.getElementById('bulkUnit').value) || 0;
      let fullBulk = getFullValue(bulkVal, bulkUnit);

      let luckVal = parseFloat(document.getElementById('luckVal').value) || 0;
      let luckUnit = parseInt(document.getElementById('luckUnit').value) || 0;
      let fullLuck = getFullValue(luckVal, luckUnit);

      let clone = parseFloat(document.getElementById('cloneVal').value) || 1;

      // Calculations
      let rollsSec = 1 / speed;
      let totalPerSec = (fullBulk * fullLuck * clone * rollsSec);

      // Render Outputs
      document.getElementById('rollsPerSec').textContent = rollsSec.toFixed(2);
      document.getElementById('totalPerSec').textContent = formatNumber(totalPerSec);
    }

    // Initialize Page
    populateDropdowns();
    calculate();
  </script>
</body>
</html>
