<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slayer Inc Master Calculator</title>
<style>
    :root {
        --bg-main: #0b0d10;
        --bg-panel: #161a22;
        --bg-card: #1c212b;
        --bg-box: #242a35;
        --border: #2e3545;
        --text-main: #e0e6ed;
        --text-muted: #8b949e;
        
        /* Standard Rarity Colors */
        --c-common: #a0a0a0;
        --c-uncommon: #4caf50;
        --c-rare: #2196f3;
        --c-epic: #9c27b0;
        --c-legendary: #ff9800;
        --c-mythical: #f44336;
        --c-secret: #ffd700;
        --c-unknown: #8a2be2;
        --c-celestial: #00ffff;
        --c-ancient: #fffacd;

        /* Aura Special Colors */
        --c-divine: #ff007f;
        --c-demonic: #d63031;
        --c-primal: #e17055;
        --c-transcendent: #74b9ff;
        --c-cosmic: #a29bfe;
        --c-ethereal: #55efc4;
        --c-void: #6c5ce7;
        --c-immortal: #fdcb6e;

        /* Custom Runen Farben */
        --c-white: #e0e6ed;
        --c-purple: #9b59b6;
        --c-dark-purple: #6c5ce7;
        --c-gold: #f1c40f;
        --c-green: #2ecc71;
        --c-red: #e74c3c;
        --c-grey: #7f8c8d;
        --c-orange: #e67e22;
        --c-pink: #fd79a8;
        --c-blue: #3498db;
        --c-dark-blue: #192a56;
        --c-cyan: #00cec9;
        --c-brown: #d35400;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        line-height: 1.5;
        padding: 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    .panel {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
    }

    h1 { text-align: center; margin-bottom: 20px; font-size: 24px; color: #fff; }

    .input-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 15px;
    }

    .input-group { display: flex; flex-direction: column; gap: 5px; }
    .input-group label { font-size: 13px; color: var(--text-muted); font-weight: bold; }
    
    .input-row { display: flex; gap: 5px; }

    input, select {
        background: var(--bg-main);
        border: 1px solid var(--border);
        color: #fff;
        padding: 12px;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--c-rare); }
    input { flex: 1; min-width: 0; }
    select { cursor: pointer; }

    .error-box {
        background: #2a1414;
        border: 1px solid var(--c-mythical);
        color: #ff8888;
        padding: 15px;
        border-radius: 8px;
        font-weight: bold;
        text-align: center;
        margin-top: 15px;
        display: none;
    }

    .global-stats {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-space: space-around;
        font-size: 14px;
        color: var(--text-muted);
    }
    .global-stats span { color: #fff; font-weight: bold; }

    .tabs {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 5px;
    }

    .tab-btn {
        background: var(--bg-main);
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
        white-space: nowrap;
    }
    .tab-btn.active { background: var(--border); color: #fff; }

    .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }

    .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        position: relative;
    }

    .card-header { text-align: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); padding-right: 30px; }
    .card-title { font-size: 18px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
    .card-chance { font-size: 12px; color: var(--text-muted); }

    .visibility-toggle {
        position: absolute;
        top: 15px;
        right: 15px;
        cursor: pointer;
        font-size: 18px;
        user-select: none;
        opacity: 0.6;
        transition: opacity 0.2s;
    }
    .visibility-toggle:hover { opacity: 1; }

    .card.hidden-rune { gap: 0; padding-bottom: 10px; }
    .card.hidden-rune .card-header { border-bottom: none; padding-bottom: 0; }
    .card.hidden-rune .card-chance, .card.hidden-rune .stat-box { display: none !important; }

    .stat-box {
        background: var(--bg-box);
        border-radius: 8px;
        padding: 12px;
        border-left: 4px solid var(--border);
    }
    .stat-head { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
    .stat-val { color: var(--c-secret); }
    
    .stat-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
        font-size: 12px;
        color: var(--text-muted);
    }
    .stat-details span { color: #fff; font-weight: bold; }
    .time-highlight { color: var(--c-rare) !important; }

    /* Rarities & Specific Classes */
    .common { color: var(--c-common); border-left-color: var(--c-common); }
    .uncommon { color: var(--c-uncommon); border-left-color: var(--c-uncommon); }
    .rare { color: var(--c-rare); border-left-color: var(--c-rare); }
    .epic { color: var(--c-epic); border-left-color: var(--c-epic); }
    .legendary { color: var(--c-legendary); border-left-color: var(--c-legendary); }
    .mythical { color: var(--c-mythical); border-left-color: var(--c-mythical); }
    .secret { color: var(--c-secret); border-left-color: var(--c-secret); text-shadow: 0 0 5px rgba(255,215,0,0.3); }
    .unknown { color: var(--c-unknown); border-left-color: var(--c-unknown); text-shadow: 0 0 5px rgba(138,43,226,0.3); }
    .celestial { color: var(--c-celestial); border-left-color: var(--c-celestial); text-shadow: 0 0 5px rgba(0,255,255,0.3); }
    .ancient { color: var(--c-ancient); border-left-color: var(--c-ancient); text-shadow: 0 0 5px rgba(255,250,205,0.3); }
    
    .divine { color: var(--c-divine); border-left-color: var(--c-divine); }
    .demonic { color: var(--c-demonic); border-left-color: var(--c-demonic); }
    .primal { color: var(--c-primal); border-left-color: var(--c-primal); }
    .transcendent { color: var(--c-transcendent); border-left-color: var(--c-transcendent); }
    .cosmic { color: var(--c-cosmic); border-left-color: var(--c-cosmic); }
    .ethereal { color: var(--c-ethereal); border-left-color: var(--c-ethereal); }
    .void { color: var(--c-void); border-left-color: var(--c-void); }
    .immortal { color: var(--c-immortal); border-left-color: var(--c-immortal); }

    /* Custom Runen Styling */
    .rune-shiny, .rune-frost, .rune-snowfall, .rune-eternalwhiteout, .rune-cinder { color: #ffffff; border-left-color: #ffffff; text-shadow: 0 0 6px rgba(255,255,255,0.5); }
    .rune-regal, .rune-voltaris, .rune-winterswrath, .rune-crystalcave, .rune-infernalsigil { color: #a29bfe; border-left-color: #9b59b6; text-shadow: 0 0 6px rgba(155,89,182,0.5); }
    .rune-auric, .rune-solsovereign, .rune-searing, .rune-ecliptor, .rune-glowstone { color: #f1c40f; border-left-color: #f1c40f; text-shadow: 0 0 6px rgba(241,196,15,0.5); }
    .rune-imperial, .rune-aetherion, .rune-cryo, .rune-icebound, .rune-absolutezero { color: #3498db; border-left-color: #192a56; text-shadow: 0 0 6px rgba(52,152,219,0.5); }
    .rune-treasury, .rune-gildedarcane, .rune-blizzard, .rune-grotto, .rune-geode { color: #2ecc71; border-left-color: #2ecc71; text-shadow: 0 0 6px rgba(46,204,113,0.5); }
    .rune-kingsmark, .rune-volcanic { color: #e74c3c; border-left-color: #e74c3c; text-shadow: 0 0 6px rgba(231,76,60,0.5); }
    .rune-charred, .rune-cavern { color: #95a5a6; border-left-color: #7f8c8d; }
    .rune-ignis, .rune-worldflare, .rune-dirt, .rune-deephollow { color: #e67e22; border-left-color: #e67e22; text-shadow: 0 0 6px rgba(230,126,34,0.5); }
    .rune-pyric { color: #fd79a8; border-left-color: #e84393; text-shadow: 0 0 6px rgba(232,67,147,0.5); }
    .rune-plasmatic, .rune-glacier, .rune-frostbite, .rune-shallow, .rune-dripstone { color: #74b9ff; border-left-color: #0984e3; text-shadow: 0 0 6px rgba(9,132,227,0.5); }
    .rune-arclight, .rune-astralis, .rune-cosmic, .rune-shiver, .rune-glacial { color: #00cec9; border-left-color: #00cec9; text-shadow: 0 0 6px rgba(0,206,201,0.5); }
    .rune-hurricane, .rune-bedrock, .rune-subterra { color: #6c5ce7; border-left-color: #6c5ce7; text-shadow: 0 0 8px rgba(108,92,231,0.6); }
    .rune-moonstone { color: #dfe6e9; border-left-color: #b2bec3; text-shadow: 0 0 8px rgba(255,255,255,0.7); }
</style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h1 id="main-title">Slayer Inc Master Calculator</h1>
        
        <!-- Controls für Runen -->
        <div class="input-grid" id="rune-controls">
            <div class="input-group">
                <label id="lbl-speed">Rune Speed (sec)</label>
                <input type="number" id="speed" value="0.1" step="0.01">
            </div>
            <div class="input-group">
                <label id="lbl-bulk">Rune Bulk</label>
                <div class="input-row">
                    <input type="number" id="bulk-num" value="100">
                    <select id="bulk-suf"></select>
                </div>
            </div>
            <div class="input-group">
                <label id="lbl-luck">Rune Luck</label>
                <div class="input-row">
                    <input type="number" id="luck-num" value="2.5" step="0.1">
                    <select id="luck-suf"></select>
                </div>
            </div>
            <div class="input-group">
                <label id="lbl-clone">Rune Clone</label>
                <input type="number" id="clone" value="3">
            </div>
        </div>

        <!-- Controls für Auren -->
        <div class="input-grid" id="aura-controls" style="display: none;">
            <div class="input-group">
                <label>Aura Speed (sec)</label>
                <input type="number" id="aura-speed" value="1.0" step="0.01">
            </div>
            <div class="input-group">
                <label>Aura Bulk</label>
                <div class="input-row">
                    <input type="number" id="aura-bulk-num" value="1">
                    <select id="aura-bulk-suf"></select>
                </div>
            </div>
            <div class="input-group">
                <label>Aura Luck</label>
                <div class="input-row">
                    <input type="number" id="aura-luck-num" value="1" step="0.1">
                    <select id="aura-luck-suf"></select>
                </div>
            </div>
        </div>

        <!-- Controls für XP -->
        <div class="input-grid" id="xp-controls" style="display: none;">
            <div class="input-group">
                <label>Current Level (S)</label>
                <input type="number" id="xp-start" value="1" min="1">
            </div>
            <div class="input-group">
                <label>Target Level (E)</label>
                <input type="number" id="xp-end" value="10" min="2">
            </div>
            <div class="input-group">
                <label>Required XP</label>
                <input type="text" id="xp-result" readonly style="color: var(--c-secret); font-weight: bold; background: var(--bg-box); cursor: default;">
            </div>
        </div>
        
        <div id="error-box" class="error-box">⚠️ SYSTEM ERROR: Speed must be greater than 0!</div>

        <div class="global-stats" id="global-stats-bar">
            <div>Rolls/sec: <span id="out-rolls">0</span></div>
            <div id="lbl-out-runs-container">Runes/sec: <span id="out-runs">0</span></div>
        </div>
    </div>

    <div class="panel">
        <div class="tabs" id="tabs-container"></div>
        <div class="cards-grid" id="cards-container"></div>
        <div id="xp-message" style="display:none; text-align:center; padding: 40px; color: var(--text-muted); font-size: 16px; font-weight: bold;">
            Match your levels in the box above to see the exact XP required.
        </div>
    </div>
</div>

<script>
const SUFFIXES = [
    {v: 1e120, s: 'Notg'}, {v: 1e117, s: 'Octg'}, {v: 1e114, s: 'Sptg'}, {v: 1e111, s: 'Sxtg'},
    {v: 1e108, s: 'Qitg'}, {v: 1e105, s: 'Qatg'}, {v: 1e102,  s: 'Tt'},   {v: 1e99,  s: 'Dtg'},
    {v: 1e96,  s: 'Utg'},  {v: 1e93,  s: 'Tr'},   {v: 1e90,  s: 'Novg'}, {v: 1e87,  s: 'Ocvg'},

    {v: 1e48,  s: 'Qui'},  {v: 1e45,  s: 'Qua'},  {v: 1e42,  s: 'Td'},   {v: 1e39,  s: 'Dd'},   
    {v: 1e36,  s: 'Ud'},   {v: 1e33,  s: 'Dc'},   {v: 1e30,  s: 'N'},    {v: 1e27,  s: 'Oc'},   
    {v: 1e24,  s: 'Sp'},   {v: 1e21,  s: 'Sx'},   {v: 1e18,  s: 'Qi'},   {v: 1e15,  s: 'Qa'},   
    {v: 1e12,  s: 'T'},    {v: 1e9,   s: 'B'},    {v: 1e6,   s: 'M'},    {v: 1e3,   s: 'K'},    
    {v: 1,     s: 'None'}
];

function parseStringValue(str) {
    if(!str || str === 'Unknown') return 'Unknown';
    str = String(str).toLowerCase().replace(/,/g, '').trim();
    const match = str.match(/^([0-9.]+)([a-z]*)$/);
    if (!match) return parseFloat(str) || 'Unknown';
    let val = parseFloat(match[1]);
    let suf = match[2];
    if (suf) {
        if(suf === 'de') suf = 'dc';
        if(suf === 'nvg') suf = 'novg';
        if(suf === 'spvg') suf = 'spvg';
        const found = SUFFIXES.find(x => x.s.toLowerCase() === suf);
        if (found) val *= found.v;
    }
    return val;
}

function formatNum(num) {
    if (num === 'Unknown') return "Unknown";
    if (!isFinite(num) || isNaN(num) || num <= 0) return "0";
    if (num < 1000) return Number.isInteger(num) ? num.toString() : num.toFixed(2);
    for (let i = 0; i < SUFFIXES.length; i++) {
        if (SUFFIXES[i].s !== 'None' && num >= SUFFIXES[i].v) {
            return (num / SUFFIXES[i].v).toFixed(2) + SUFFIXES[i].s;
        }
    }
    return num.toFixed(2);
}

function formatTime(sec) {
    if (!isFinite(sec) || isNaN(sec) || sec <= 0) return "N/A";
    if (sec < 60) return sec.toFixed(1) + "s";
    if (sec < 3600) return Math.floor(sec/60) + "m " + Math.floor(sec%60) + "s";
    if (sec < 86400) return Math.floor(sec/3600) + "h " + Math.floor((sec%3600)/60) + "m";
    if (sec < 2592000) return Math.floor(sec/86400) + "d " + Math.floor((sec%86400)/3600) + "h";
    if (sec < 31536000) return Math.floor(sec/2592000) + "mo " + Math.floor((sec%2592000)/86400) + "d";
    return Math.floor(sec/31536000) + "y " + Math.floor((sec%31536000)/2592000) + "mo";
}

let currentTab = "Hidden Runes";
let hiddenRunes = JSON.parse(localStorage.getItem('slayer_v3_hidden_runes')) || {};

function initDropdowns() {
    const selects = ["bulk-suf", "luck-suf", "aura-bulk-suf", "aura-luck-suf"];
    const reversedSuffixes = [...SUFFIXES].reverse();
    
    selects.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.innerHTML = "";
        reversedSuffixes.forEach(x => {
            const op = document.createElement("option");
            op.value = x.s; op.innerText = x.s;
            el.appendChild(op);
        });
        el.value = "None";
    });
}

function renderTabs() {
    const tabs = ["XP Calculator", "Aura Calculator"].concat(Object.keys(DATA));
    const cont = document.getElementById("tabs-container");
    cont.innerHTML = tabs.map(tab => 
        `<div class="tab-btn ${tab===currentTab?'active':''}" onclick="setTab('${tab}')">${tab}</div>`
    ).join("");
}

function isCaveSystem(tab) {
    return tab === "Cave Rune" || tab === "Cave Hidden";
}

function updateLabels() {
    const prefix = isCaveSystem(currentTab) ? "Cave" : "Rune";
    document.getElementById("lbl-speed").innerText = `${prefix} Speed (sec)`;
    document.getElementById("lbl-bulk").innerText = `${prefix} Bulk`;
    document.getElementById("lbl-luck").innerText = `${prefix} Luck`;
    document.getElementById("lbl-clone").innerText = `${prefix} Clone`;
    document.getElementById("lbl-out-runs-container").innerHTML = `${prefix}s/sec: <span id="out-runs">0</span>`;
}

function loadTabInputs() {
    if (currentTab === "XP Calculator" || currentTab === "Aura Calculator") return;
    const systemKey = isCaveSystem(currentTab) ? "cave" : "normal";
    
    const defaults = {
        speed: "0.1",
        "bulk-num": isCaveSystem(currentTab) ? "1" : "100",
        "bulk-suf": "None",
        "luck-num": isCaveSystem(currentTab) ? "1" : "2.5",
        "luck-suf": "None",
        clone: isCaveSystem(currentTab) ? "1" : "3"
    };

    ['speed', 'bulk-num', 'bulk-suf', 'luck-num', 'luck-suf', 'clone'].forEach(id => {
        const el = document.getElementById(id);
        const storedVal = localStorage.getItem(`slayer_v3_${systemKey}_${id}`);
        el.value = storedVal !== null ? storedVal : defaults[id];
    });
}

function saveTabInputs() {
    if (currentTab === "XP Calculator" || currentTab === "Aura Calculator") return;
    const systemKey = isCaveSystem(currentTab) ? "cave" : "normal";
    ['speed', 'bulk-num', 'bulk-suf', 'luck-num', 'luck-suf', 'clone'].forEach(id => {
        const el = document.getElementById(id);
        localStorage.setItem(`slayer_v3_${systemKey}_${id}`, el.value);
    });
}

function setTab(tab) {
    currentTab = tab;
    renderTabs();
    
    document.getElementById("rune-controls").style.display = "none";
    document.getElementById("xp-controls").style.display = "none";
    document.getElementById("aura-controls").style.display = "none";
    document.getElementById("error-box").style.display = "none";
    document.getElementById("global-stats-bar").style.display = "none";
    document.getElementById("cards-container").style.display = "none";
    document.getElementById("xp-message").style.display = "none";

    if (tab === "XP Calculator") {
        document.getElementById("xp-controls").style.display = "grid";
        document.getElementById("xp-message").style.display = "block";
        calculateXP();
    } else if (tab === "Aura Calculator") {
        document.getElementById("aura-controls").style.display = "grid";
        document.getElementById("global-stats-bar").style.display = "flex";
        document.getElementById("cards-container").style.display = "grid";
        document.getElementById("lbl-out-runs-container").innerHTML = `Auras/sec: <span id="out-runs">0</span>`;
        calculateAura();
    } else {
        document.getElementById("rune-controls").style.display = "grid";
        document.getElementById("global-stats-bar").style.display = "flex";
        document.getElementById("cards-container").style.display = "grid";
        updateLabels();
        loadTabInputs();
        calculate();
    }
}

function toggleRuneVisibility(tab, runeName) {
    if (!hiddenRunes[tab]) hiddenRunes[tab] = {};
    hiddenRunes[tab][runeName] = !hiddenRunes[tab][runeName];
    localStorage.setItem('slayer_v3_hidden_runes', JSON.stringify(hiddenRunes));
    calculate();
}

function getMultiplier(suffixStr) {
    const found = SUFFIXES.find(x => x.s === suffixStr);
    return found ? found.v : 1;
}

function calculateXP() {
    const S = parseFloat(document.getElementById("xp-start").value) || 0;
    const E = parseFloat(document.getElementById("xp-end").value) || 0;
    
    if (E <= S) {
        document.getElementById("xp-result").value = "0 (E must be > S)";
        return;
    }
    
    const xp = 500 * (Math.pow(1.2, E) - Math.pow(1.2, S));
    document.getElementById("xp-result").value = formatNum(xp);
}

function calculateAura() {
    const speed = parseFloat(document.getElementById("aura-speed").value) || 0;
    const bulkNum = parseFloat(document.getElementById("aura-bulk-num").value) || 0;
    const bulkMult = getMultiplier(document.getElementById("aura-bulk-suf").value);
    const bulk = bulkNum * bulkMult;

    const luckNum = parseFloat(document.getElementById("aura-luck-num").value) || 0;
    const luckMult = getMultiplier(document.getElementById("aura-luck-suf").value);
    const luck = luckNum * luckMult;

    const errBox = document.getElementById("error-box");
    const statsBar = document.getElementById("global-stats-bar");
    const cardsCont = document.getElementById("cards-container");

    if (speed <= 0) {
        errBox.style.display = "block";
        statsBar.style.display = "none";
        cardsCont.innerHTML = `<div style="text-align:center; color:var(--c-mythical); width:100%; grid-column: 1/-1; padding: 40px; font-weight:bold;">SPEED MUST BE GREATER THAN 0</div>`;
        return;
    } else {
        errBox.style.display = "none";
        statsBar.style.display = "flex";
    }

    const rollsPerSec = 1 / speed;
    const runsPerSec = rollsPerSec * bulk;

    document.getElementById("out-rolls").innerText = formatNum(rollsPerSec);
    document.getElementById("out-runs").innerText = formatNum(runsPerSec);

    let html = "";
    AURA_DATA.forEach(aura => {
        const baseDenom = parseStringValue(aura.c);
        
        const isLuckInvalid = (!isFinite(luck) || luck <= 0);
        let currentDenom = isLuckInvalid ? "Unknown" : (baseDenom / luck);
        
        const isNA = (runsPerSec <= 0 || currentDenom === "Unknown" || !isFinite(currentDenom) || currentDenom <= 0);
        const expectedDropsPerSec = isNA ? 0 : (runsPerSec * (1 / currentDenom));
        
        const chanceStr = isNA ? "N/A" : `1 in ${formatNum(currentDenom)}`;
        const expStr = (isNA || expectedDropsPerSec <= 0) ? "N/A" : formatNum(expectedDropsPerSec);

        const timeToFirstSec = expectedDropsPerSec > 0 ? (1 / expectedDropsPerSec) : Infinity;
        const timeToFirstStr = isFinite(timeToFirstSec) ? formatTime(timeToFirstSec) : "N/A";

        html += `
        <div class="card">
            <div class="card-header">
                <div class="card-title ${aura.t}">${aura.r}</div>
                <div class="card-chance">Base: 1 in ${formatNum(baseDenom)} | Current: ${chanceStr}</div>
            </div>
            <div class="stat-box ${aura.t}">
                <div class="stat-details" style="grid-template-columns: 1fr 1fr;">
                    <div>Exp/sec: <span>${expStr}</span></div>
                    <div>Est. Time for 1: <span class="time-highlight">${timeToFirstStr}</span></div>
                </div>
            </div>
            <div style="margin-top: 10px; font-size: 0.85em;">
                <strong>Stats:</strong><br>
                ${aura.s.map(stat => `<span style="color:#aaa;">${stat.n}: <b style="color:#fff;">${stat.v}</b></span>`).join(" | ")}
            </div>
        </div>`;
    });

    cardsCont.innerHTML = html;
}

function calculate() {
    const speed = parseFloat(document.getElementById("speed").value) || 0;
    const clone = parseFloat(document.getElementById("clone").value) || 1;
    
    const errBox = document.getElementById("error-box");
    const statsBar = document.getElementById("global-stats-bar");
    const cardsCont = document.getElementById("cards-container");

    if (speed < 0.08 || speed > 1.00) {
        errBox.style.display = "block";
        statsBar.style.display = "none";
        cardsCont.innerHTML = `<div style="text-align:center; color:var(--c-mythical); width:100%; grid-column: 1/-1; padding: 40px; font-weight:bold;">CALCULATION HALTED DUE TO SPEED ERROR</div>`;
        return;
    } else {
        errBox.style.display = "none";
        statsBar.style.display = "flex";
    }

    const bulkNum = parseFloat(document.getElementById("bulk-num").value) || 0;
    const bulkMult = getMultiplier(document.getElementById("bulk-suf").value);
    const bulk = bulkNum * bulkMult;

    const luckNum = parseFloat(document.getElementById("luck-num").value) || 0;
    const luckMult = getMultiplier(document.getElementById("luck-suf").value);
    const luck = luckNum * luckMult;

    const rollsPerSec = speed > 0 ? (1 / speed) : 0;
    const runsPerSec = rollsPerSec * bulk;

    document.getElementById("out-rolls").innerText = formatNum(rollsPerSec);
    document.getElementById("out-runs").innerText = formatNum(runsPerSec);

    if (!DATA[currentTab]) return;

    let runeList = DATA[currentTab].map((rune, index) => {
        const isHidden = !!(hiddenRunes[currentTab] && hiddenRunes[currentTab][rune.r]);
        const baseDenom = parseStringValue(rune.c);
        
        const isLuckInvalid = (!isFinite(luck) || luck <= 0);
        let currentDenom = isLuckInvalid ? "Unknown" : (baseDenom / luck);
        
        const isNA = (runsPerSec <= 0 || currentDenom === "Unknown" || !isFinite(currentDenom) || currentDenom <= 0);
        const expectedDropsPerSec = isNA ? 0 : (runsPerSec * (1 / currentDenom) * clone);
        
        const chanceStr = isNA ? "N/A" : `1 in ${formatNum(currentDenom)}`;
        const expStr = (isNA || expectedDropsPerSec <= 0) ? "N/A" : formatNum(expectedDropsPerSec);

        return {
            originalData: rune,
            originalIndex: index,
            isHidden: isHidden,
            baseDenom: baseDenom,
            chanceStr: chanceStr,
            expStr: expStr,
            expectedDropsPerSec: expectedDropsPerSec,
            isNA: isNA
        };
    });

    runeList.sort((a, b) => {
        if (a.isHidden !== b.isHidden) return a.isHidden - b.isHidden;
        return a.originalIndex - b.originalIndex;
    });

    let html = "";
    runeList.forEach(item => {
        const rune = item.originalData;
        const eyeIcon = item.isHidden ? "🙈" : "👁️";
        const hiddenClass = item.isHidden ? "hidden-rune" : "";

        html += `
        <div class="card ${hiddenClass}">
            <div class="visibility-toggle" onclick="toggleRuneVisibility('${currentTab}', '${rune.r}')">${eyeIcon}</div>
            <div class="card-header">
                <div class="card-title ${rune.t}">${rune.r}</div>
                <div class="card-chance">Base: 1 in ${formatNum(item.baseDenom)} | Current: ${item.chanceStr}</div>
            </div>`;

        rune.s.forEach(stat => {
            const isStatUnknown = (stat.nd === "Unknown");
            const needVal = isStatUnknown ? "Unknown" : parseStringValue(stat.nd);
            
            const timeSec = (!item.isNA && item.expectedDropsPerSec > 0 && !isStatUnknown) ? (needVal / item.expectedDropsPerSec) : Infinity;
            const timeStr = (item.isNA || isStatUnknown || !isFinite(timeSec) || timeSec <= 0) ? "N/A" : formatTime(timeSec);
            const needDisplay = isStatUnknown ? "Unknown" : formatNum(needVal);

            html += `
            <div class="stat-box ${rune.t}">
                <div class="stat-head">
                    <span>${stat.n} <span class="stat-val">${stat.v}</span></span>
                </div>
                <div class="stat-details">
                    <div>Need: <span>${needDisplay}</span></div>
                    <div>Exp/sec: <span>${item.expStr}</span></div>
                    <div style="grid-column: span 2; margin-top:5px;">
                        Time to Max: <span class="time-highlight">${timeStr}</span>
                    </div>
                </div>
            </div>`;
        });

        html += `</div>`;
    });

    cardsCont.innerHTML = html;
}

initDropdowns();

const inputIds = [
    'speed', 'bulk-num', 'bulk-suf', 'luck-num', 'luck-suf', 'clone', 
    'aura-speed', 'aura-bulk-num', 'aura-bulk-suf', 'aura-luck-num', 'aura-luck-suf',
    'xp-start', 'xp-end'
];

inputIds.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;

    if (id === 'xp-start' || id === 'xp-end') {
        if(localStorage.getItem('slayer_v3_'+id)) el.value = localStorage.getItem('slayer_v3_'+id);
    }
    
    const handler = () => {
        if (id === 'xp-start' || id === 'xp-end') {
            localStorage.setItem('slayer_v3_'+id, el.value);
            calculateXP();
        } else if (currentTab === "Aura Calculator") {
            calculateAura();
        } else {
            saveTabInputs();
            calculate();
        }
    };
    
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
});

loadTabInputs();
renderTabs();
calculate();
</script>

</html>
